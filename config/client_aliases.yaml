# 거래처 별칭표 (config/client_aliases.yaml) — watcher가 매 폴링 다시 읽음 (재시작 불필요)
#
# 형식:  "시트 표기": "경리나라 정식 등록명 그대로"   또는   "시트 표기": "000-00-00000" (사업자번호)
#   - 한 등록명에 약칭 여럿 OK, 한 약칭이 두 곳을 가리키면 안 됨
#   - 정식명은 `python agent.py clients find <검색어>` 로 찾고, 고친 뒤 `python agent.py aliases check`
#   - 동명(같은 이름에 사업자번호 둘 이상)을 확실히 고정하려면 등록명 대신 사업자번호로
#
# 거래처 해석 순서 (㈜/(주)/주식회사/공백/대소문자 무시):
#   a. 별칭표 일치  b. 마스터 이름 정확일치  c. 최장 일치(시트 문구 앞부분 = 이름, 나머지는 비고)
#      — 별칭도 앞부분 일치에 쓰임 ("STM 급함" → STM 별칭), 같은 길이면 별칭 우선
#   d. 없으면 보류-미등록
#   같은 표기에 등록이 여럿(동명, 또는 '(주)대양상사'/'대양상사')이면:
#     별칭의 사업자번호 > 최근 12개월 명세표가 있는 번호가 하나뿐이면 그쪽('동명→최근거래 번호')
#     > 아니면 보류 (이름 하나 = 보류-동명, 표기 여럿 = 보류-미등록 + 로그에 후보)
#
# 아래 주석은 제안일 뿐 (후보 = 이름 유사도 → 2025~2026 건수 순). 확정하려면 줄 맨 앞 '# '를 지우고
# "" 안에 정식명(또는 사업자번호)을 넣는다.
#
# STM/에스티엠은 서로 다른 거래처:
#   에스티엠(STM)  140-03-58500  최근 2026-11-25  2026년 7건
#   에스티엠       134-29-95780  최근 2026-09-03  2026년 2건


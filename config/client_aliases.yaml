# 거래처 별칭표 (config/client_aliases.yaml) — watcher가 매 폴링 다시 읽음 (재시작 불필요)
# 고친 뒤 `python agent.py aliases check`, 정식명 찾기는 `python agent.py clients find <검색어>`.
#
# aliases:         "시트 표기": "경리나라 정식 등록명 그대로"  또는  "000-00-00000" (사업자번호)
#                  한 등록명에 약칭 여럿 OK, 한 약칭이 두 곳을 가리키면 안 됨
# homonyms:        같은 이름에 법인·개인 사업자가 따로 있는 거래처 (동명 규칙)
#                  시트 원문에 (주)/주)/㈜/주식회사 → 법인, (개인) → 개인 번호로 확정.
#                  표시가 없으면 상태 '동명확인': '기본' 쪽으로 단가만 적고 발행 안 함.
#                  거래처 칸에 주) 또는 (개인)을 붙이면 다음 폴링에 확정.
# manual_clients:  "시트 표기": "사유" → 해석 없이 묶음 전체 사람처리 (견적·발행 안 함, 사유는 산출근거에)
#
# 거래처 해석 순서 (㈜/(주)/주식회사/공백/대소문자 무시, 시트 문구 앞부분이 이름이고 나머지는 비고):
#   가장 길게 맞는 표기 우선, 같은 길이면 manual_clients > aliases > homonyms > 거래처 마스터.
#   못 찾으면 보류-미등록.
#   homonyms에 없는 동명(같은 표기에 사업자번호 둘 이상): 최근 12개월 명세표가 있는 번호가 하나뿐이면
#   그쪽('동명→최근거래 번호'), 아니면 보류 (이름 하나 = 보류-동명, 표기 여럿 = 보류-미등록 + 로그에 후보).
#
# STM/에스티엠은 서로 다른 거래처:
#   에스티엠(STM)  140-03-58500  최근 2026-11-25  2026년 7건
#   에스티엠       134-29-95780  최근 2026-09-03  2026년 2건


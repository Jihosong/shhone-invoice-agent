# shhone-invoice-agent — 시트 설정 (config/sheets.yaml)
# 열은 A=1 기준 숫자. 헤더/데이터 시작행, 월 탭 규칙, 에이전트 전용 열을 여기서만 관리한다.
# 시트 구조가 바뀌면 코드가 아니라 이 파일만 고친다.

common:
  credentials_file: C:/dev/secrets/gcp-service-account.json
  poll_interval_sec: 15           # Sheets API 할당량 계산은 README '폴링 주기와 API 할당량'
  quote_settle_min: 5            # 마지막 수정 후 N분 무변화 → 가견적
  # 감시 탭 (watcher.pick_active_tab, 위치 무관): ① '당월' 이름 탭 ② 오늘 달 'N월' 탭 ③ 직전 달 'N월' 탭 + WARNING
  #   (1월이면 12월). 같은 단계에 맞는 탭이 둘 이상이면 ERROR + 그 시트 처리 중단.
  #   월초 점검: 감시 탭에 오늘 달 날짜 행이 없고 지난달 행만 있으면 매 폴링 WARNING '당월 탭 갱신 필요'.
  #   날짜 칸 연도는 탭 이름이 아니라 오늘 기준 (12월 탭의 1/2 → 새해 등)
  active_tab_rule: current_month
  month_tab_pattern: '^\d{1,2}월$'
  author_ai_value: AI            # 작성자 칸에 에이전트가 쓰는 값
  skip_clients:                  # 월말 일괄 처리 거래처 → 에이전트 제외 (상태: 제외-월말일괄)
    - 대성연마
    - 삼화연마
    - 한국유압
    - 한국하이드로릭
    - 영성기공
  status_values:
    - 입력중
    - 확정
    - 동명확인                  # homonyms 거래처에 법인/개인 표시 없음 → 기본 쪽으로 단가만, 발행 안 함
    - 견적완료
    - 견적완료(사람수정)          # 견적확인필요 행 단가를 사람이 고쳐 확정 (발행 조건상 견적완료)
    - 견적완료(사람확인)          # 가견적 행 상태 칸만 비워 적힌 단가로 확정 (발행 조건상 견적완료)
    - 견적확인필요                # 견적확인필요 처리법: 상태 칸에 '확인'(또는 ok/OK) 입력 또는 비우기 → 견적완료(사람확인)
                                #   / 단가 칸 수정 → 견적완료(사람수정). 그 밖의 모르는 글자는 건드리지 않음(WARNING)
    - 명세표발행대기                  # 발행 조건 충족 → data/outbox 파일에 담김, 사람이 업로드 후 작성자 AI → 명세표발행완료(AI)
    - 명세표발행대기-수정됨            # 파일에 담긴 뒤 행 수정 → 올린 파일과 어긋남, 사람이 확인 (작성자 AI/사람 이름으로 정리)
    - 사람처리-명세표중복확인          # 파일에 담긴 뒤 사람 작성자 → 경리나라 중복 발행 확인, 사람이 상태 칸 비우면 보통 사람처리
    - 진행중
    - 명세표발행완료(AI)
    - 명세표인쇄완료(AI)              # (2단계용 예약) 인쇄까지 끝남 — 지금은 에이전트가 쓰지 않음, 발행완료처럼 유지
    - 보류-동명
    - 보류-미등록
    - 보류-화면이상
    - 제외-월말일괄
    - 기존건-확인필요            # 최초 발견 시 이미 작업완료/출고완료 → 견적·발행 대상 아님
  # 옛 이름(발행대기·발행대기-수정됨·AI발행·AI발행-인쇄됨·사람처리-발행확인)이 시트에 남아 있으면 다음 폴링에
  # 새 이름으로 바꿔 씀 (watcher.LEGACY_STATUS_NAMES, DB rows.status도 시작할 때 이전)
  # (DB 전용 '삭제됨': 시트에서 row_id가 사라진 행 — 시트에는 쓰지 않으므로 위 목록에 넣지 않음)

# 발행기 1단계 '반자동' (issuer/outbox.py) — 파일은 에이전트가, 업로드는 사람이
#   발행 조건(묶음 단위): 모든 품목 행 견적완료(또는 견적확인필요 + 사람 단가) + 작성자 빈칸 + 기존건 아님
#   + 모든 행 작업완료 TRUE + 그중 하나 이상 FALSE→TRUE를 에이전트가 봄 → 묶음 전체 '명세표발행대기'.
#   bundle_interval_min마다(또는 agent.py issue) 아직 파일에 없는 명세표발행대기 묶음 → outbox_dir/YYYYMMDD_HHMM.xls.
#   업로드 후 작성자를 AI로 → 묶음 전체 명세표발행완료(AI). 파일에 담긴 뒤 수정 → 명세표발행대기-수정됨(WARNING).
issue:
  outbox_dir: data/outbox
  bundle_interval_min: 3
  # 공통메모(명세표마다 첫 줄에만). '(AI)'로 끝나야 월간 import가 AI 발행(statements.issued_by='AI')으로 알아봄.
  # 묶음 추적은 DB issue_file_blocks로 한다.
  memo_text: "(주)삼화호닝 기업 451-079229-04-018, 감사합니다. (AI)"

# 임가공 견적 정책 (pricer_job) — 운영·백테스트 공통. 고치면 다음 견적부터 반영 (재시작 불필요)
pricing:
  same_item_6_12m_confidence: mid   # 6~12개월 동일품(직전 단가 그대로): high → 견적완료 / mid → 가견적·견적확인필요
  # 견적완료 이후 변경: 기본은 재견적 없이 단가·상태 유지 + 산출근거 '[변경 11/27 14:05: H -0.3 추가]'(최근 3개).
  # post_quote_recheck: true면 사람 단가 행만 D·E·F 변경 또는 아래 치대 기준 이상 → 견적확인필요(단가 유지)
  post_quote_recheck: false
  post_quote_chidae_ratio: 0.004    # |치대| ÷ 구경 ≥ 0.4%
  post_quote_chidae_mm: 1.0         # 또는 |치대| ≥ 1mm
  post_quote_chidae_nodia_mm: 0.2   # 구경을 모르면 |치대| ≥ 0.2mm

# 묶음(block) 규칙 — 두 시트 공통 (watcher.py)
#   날짜 칸이 있는 행 = 묶음 첫 행. 거래처는 이 행의 거래처 칸에서만 해석(별칭표 config/client_aliases.yaml
#   > 마스터 정확일치 > 최장 일치, ㈜/(주)/주식회사/공백 무시), 일치 뒤 남은 글자는 client_note.
#   동명(같은 표기에 사업자번호 둘 이상): 별칭 사업자번호 > 최근 12개월 거래 번호가 하나뿐이면 그쪽
#   (산출근거 '동명→최근거래 번호') > 보류-동명. 표기가 다른 등록 여럿이 같은 길이로 맞으면 보류-미등록.
#   client_aliases.yaml homonyms(법인/개인 따로 있는 이름): 원문 (주)/주)/㈜/주식회사 → 법인, (개인) → 개인으로 확정.
#   표시가 없으면 묶음 전체 '동명확인' — 기본 쪽 번호로 단가만 적고 발행 안 함, 산출근거에 [동명확인: …] 안내.
#   거래처 칸만 고치면(품목 칸 그대로) 다음 폴링에 바로 확정. manual_clients 표기 → 묶음 전체 사람처리 + 사유.
#   날짜 없는 행 = 바로 위 묶음의 이어지는 줄. 거래처 칸은 통째로 client_note.
#   item_columns 중 하나라도 있으면 품목 행, 없으면 메모 행(건너뜀, 상태 비움).
#   첫 행 작성자가 사람 → 묶음 전체 사람처리. 첫 행 거래처 미해석 → 묶음 전체 '보류-미등록'.
#   확정 판정은 묶음 단위(묶음 안 최신 수정 후 quote_settle_min 경과 → 묶음 전체 함께 확정).
#   보류-미등록·보류-동명(같은 이름에 사업자번호 둘 이상)은 매 폴링 재검사 → 풀리면 자동 해제.
#   보류-화면이상은 사람이 묶음 안 아무 행의 상태 칸을 비우면 묶음 전체 재평가.
#   산출근거 맨 앞 "[거래처(비고) 날짜 n/총줄수]"는 에이전트 처리 행에만 (사람처리·제외 행 안 건드림).
#   행 정체성은 row_id 열, 변경 여부는 hash_columns 지문으로만. 행 이동·위쪽 행 삭제·n/m 변화는 변경 아님.

sheets:

  imgagong:                       # 임가공 작업현황표
    spreadsheet_id: 1dovejbcRaBFha0ywtrGfwzig74caFzAs1ExUmLQReWU
    kind: job                     # 견적 엔진: DB 사례 + 규칙 + AI
    header_rows: 2                # 1행 인니어, 2행 한국어
    data_start_row: 3
    client_master_tab: 거래처번호   # (거래처명, 연락처) — 참고용
    columns:
      date: 1                     # A 날짜 (텍스트 '8/20', 연도 없음)
      client: 2                   # B 거래처
      photo: 3                    # C 물품사진 (셀 내 이미지, v1 미사용)
      main_msg: 4                 # D 주요 메시지
      spec_qty: 5                 # E 공차x갯수, 조도
      difficulty: 6               # F 난이도
      operator: 7                 # G 작업자
      stock_removal: 8            # H 연마량/치대 (드롭다운, 비면 일반)
      work_start: 9               # I 작업시작
      work_end: 10                # J 작업완료  <- 발행 트리거
      inspect_done: 11            # K 검수완료
      inspector: 12               # L 검수자
      client_phone: 13            # M 거래처 연락처
      client_sms: 14              # N 거래처 문자 알림
      author: 15                  # O 거래명세표 (작성자 드롭다운: 사장/팀장/…/AI) <- 잠금
      shipped: 16                 # P 출고완료
      sms_status: 17              # Q
      sms_time: 18                # R
      pre_note: 19                # S 호닝 전 매니저 노트
      post_size: 20               # T 호닝 후 치수
      post_note: 21               # U 호닝 후 매니저 노트
      work_start_time: 22         # V
      work_duration: 23           # W
      status: 24                  # X 상태
      unit_price: 25              # Y 단가 (원 단위 정수)
      basis: 26                   # Z 산출근거
      statement_no: 27            # AA 명세표번호
      row_id: 28                  # AB 행ID (에이전트가 최초 발견 시 기록)
    hash_columns: [client, main_msg, spec_qty, difficulty, stock_removal]
    item_columns: [spec_qty, main_msg]   # 하나라도 있으면 품목 행, 없으면 메모 행
    issue_trigger: work_end
    spec_format_hint: 'Ø내경 공차 / 길이 × 수량  (예: Ø30 +0.0~+0.03 / 720 × 2개)'

  pipe:                           # 호닝파이프 작업현황표
    spreadsheet_id: 1NgKVHX2aJyE4yMB2QQmpFZpYuyGm7Y_Y6ZeB1rmNwDk
    kind: pipe                    # 견적 엔진: 단가표 결정적 계산
    header_rows: 1
    data_start_row: 2
    ignore_tabs: [재고, 재고현황]
    columns:
      date: 1                     # A 날짜
      client: 2                   # B 회사
      pipe_type: 3                # C H.P/소관 (비어 있으면 견적확인필요)
      size: 4                     # D 규격 (I.D/O.D) '45x55'
      length: 5                   # E 길이 (mm)
      qty: 6                      # F 갯수 '144개'
      work_end: 7                 # G 작업완료  <- 발행 트리거
      shipped: 8                  # H 출고완료
      author: 9                   # I 거래명세표 (작성자 드롭다운) <- 잠금
      worker_sms: 10              # J
      client_phone: 11            # K
      client_sms: 12              # L
      note1: 13                   # M 비고1
      note2: 14                   # N 비고2
      sms_status: 15              # O
      sms_time: 16                # P
      month_end_toggle: 17        # Q (Q1 = 월말 일괄 토글, 데이터 행에선 미사용)
      status: 18                  # R 상태
      unit_price: 19              # S 단가
      basis: 20                   # T 산출근거
      statement_no: 21            # U 명세표번호
      row_id: 22                  # V 행ID
    hash_columns: [client, pipe_type, size, length, qty]
    item_columns: [size, length, qty]    # 하나라도 있으면 품목 행, 없으면 메모 행
    issue_trigger: work_end
    price_table: data/price_table.xlsx
